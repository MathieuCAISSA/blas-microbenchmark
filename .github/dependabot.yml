# Keeps the GitHub Actions the workflows use up to date: one grouped pull
# request a week at most, which CI then checks like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: CI
  # The Docker image's base (packaging/docker/Dockerfile), pinned by digest.
  - package-ecosystem: docker
    directory: /packaging/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: Docker
