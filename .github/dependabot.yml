# Keeps the GitHub Actions the workflows use up to date, the Docker
# image's base (packaging/docker) and ClusterFuzzLite's builder image
# (.clusterfuzzlite): a pull request a week at most for each, which CI
# then checks like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: CI
  # The Docker image's base (packaging/docker/Dockerfile), pinned by digest.
  - package-ecosystem: docker
    directory: /packaging/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: Docker
  # The image ClusterFuzzLite builds the fuzz targets in
  # (.clusterfuzzlite/Dockerfile), pinned by digest too.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    commit-message:
      prefix: Fuzzing
