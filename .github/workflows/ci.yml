name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libopenblas-dev pkg-config

      - name: autoreconf
        run: autoreconf -fi

      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure

      - name: make
        run: make -C build -j"$(nproc)"

      - name: make check
        run: make -C build check

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/**/test-suite.log
            build/**/*.sh.log
          if-no-files-found: ignore

      - name: make distcheck
        run: make -C build distcheck -j"$(nproc)"
