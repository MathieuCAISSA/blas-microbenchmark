name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only read the repository; nothing they run gets a token that
# could write to it.
permissions:
  contents: read

# A pull request's run is cancelled when a new push supersedes it, to free
# the runners for the others (#305); a run on main never is.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request changes documentation only (#305): Markdown,
  # doc/dev and doc/images, the man pages and the site's guides. Then the
  # openblas job, whose make check reads every page and link, and the man
  # job run, and the jobs that build and test a library are skipped. If
  # this job fails, they all run: a skipped job would pass a required
  # check. The matrix jobs (browsers, fuzz, docker, spack) always run: a
  # matrix job skipped whole reports under its bare name, and the checks
  # required under its matrix names would wait for ever.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # A pull request's merge commit against its first parent, the base it
      # was merged onto: what the pull request changes.
      - name: Changed files
        id: files
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > changed.txt
            cat changed.txt
            if [ -s changed.txt ] &&
               ! grep -Ev '\.md$|^doc/(dev|images)/|^man/site/|^man/[a-z_-]+\.1\.in$' changed.txt >/dev/null; then
              docs_only=true
            fi
          fi
          echo "docs only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # OpenBLAS, the default backend and the BLAS most distributions ship,
  # from Ubuntu's libopenblas-dev. Besides make check and the verify sweep
  # every library job runs, this one checks what needs doing once: that
  # the browser tests did run (the runner has Chrome), the files and their
  # links, what make install puts where, and make distcheck.
  openblas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libopenblas-dev pkg-config

      - name: autoreconf
        run: autoreconf -fi

      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure --enable-werror

      - name: make
        run: make -C build -j"$(nproc)"

      # What this job measured on: the backend, and the machine as the
      # probe sees it. On the arm64 runners this is also where to look to
      # find out what /proc/cpuinfo actually offers there.
      - name: Provenance
        run: build/src/c/level1/double/bmb_ddot --version

      - name: make check
        run: make -C build check

      # --verify at the sizes and thread counts a user measures, against this
      # job's library: make check only uses tiny ones.
      - name: Verified at real sizes
        run: .github/scripts/verify-sweep.sh build

      # The browser tests SKIP without a browser, which make check counts
      # as a pass. The x86 runners have Chrome, so here a SKIP means the
      # page went unchecked: fail instead.
      - name: The page was checked in a browser
        run: |
          if grep -l '^:test-result: SKIP' build/src/report/test_bmb_report_render.sh.trs \
                                          build/src/report/test_bmb_report_js.sh.trs; then
            echo "the browser tests were skipped"; exit 1
          fi

      # These SKIP outside a git checkout (or without .github/), which this is.
      - name: The files and their links were checked
        run: |
          for t in tests/test_editorconfig.sh tests/test_doc_links.sh tests/test_actions_pinned.sh; do
            if ! grep -q '^:test-result: PASS' "build/$t.trs"; then
              cat "build/$t.log"; exit 1
            fi
          done

      # Everything goes where --prefix says, and nowhere else: installed
      # into a staging root, nothing may land outside <root>/<prefix>.
      - name: Install layout
        run: |
          mkdir -p build-install
          cd build-install
          ../configure --prefix=/opt/bmb-test
          make -j"$(nproc)"
          make install DESTDIR="$PWD/stage"
          outside=$(find stage -type f ! -path 'stage/opt/bmb-test/*')
          if [ -n "$outside" ]; then
            echo "installed outside the prefix:"; echo "$outside"; exit 1
          fi
          P=stage/opt/bmb-test
          test -x $P/bin/bmb_report
          test -x $P/bin/bmb_suite
          test -x $P/libexec/blas-microbenchmark/level1/bmb_ddot
          test -x $P/libexec/blas-microbenchmark/level2/bmb_dgemv
          test -x $P/libexec/blas-microbenchmark/level3/bmb_dgemm
          test -f $P/share/man/man1/blas-microbenchmark.1
          test -f $P/share/man/man1/bmb_report.1
          test -f $P/share/man/man1/bmb_suite.1
          grep -qx '.so man1/blas-microbenchmark.1' $P/share/man/man1/bmb_dgemm.1
          # The page gives the install path, as the reader sees it.
          MANPAGER=cat MANWIDTH=200 man -l $P/share/man/man1/blas-microbenchmark.1 \
            | grep -qF /opt/bmb-test/libexec/blas-microbenchmark/level1
          $P/libexec/blas-microbenchmark/level3/bmb_dgemm -x 0 -i 1 -m 16 -o r.json >/dev/null
          $P/bin/bmb_report r.json > r.html
          grep -qi '^<!doctype html>' r.html
          find stage -type f | sort
          # bmb_suite runs the benchmarks where they were installed, not
          # where they were staged: installed for real, it finds them.
          sudo make install >/dev/null
          /opt/bmb-test/bin/bmb_suite --routine ddot,dgemm -o runs -- -x 0 -i 1 -w 0 -v 64 -m 16
          test -s runs/ddot.json && test -s runs/dgemm.json
          /opt/bmb-test/bin/bmb_report runs > runs.html
          test "$(grep -c 'class="bmb-result"' runs.html)" = 2

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-openblas
          path: |
            build/**/test-suite.log
            build/**/*.sh.log
          if-no-files-found: ignore

      - name: make distcheck
        run: make -C build distcheck -j"$(nproc)"

      # As the README has users install it, and as the release workflow
      # checks it: the tarball configured in place, not in a directory of
      # its own as everything above. A test that only worked out of tree
      # stopped the 1.5.0 release there (#98).
      - name: The tarball, built in place
        run: |
          mkdir -p in-place
          tar xf build/blas-microbenchmark-*.tar.gz -C in-place
          cd in-place/blas-microbenchmark-*/
          ./configure
          make -j"$(nproc)"
          make check

  # BLIS, from Ubuntu's libblis-openmp-dev, whose cblas.h is in a
  # directory of its own (/usr/include/<triplet>/blis-openmp) that configure
  # finds by itself, and whose threads -t sets through
  # bli_thread_set_num_threads().
  blis:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libblis-openmp-dev pkg-config

      - name: autoreconf
        run: autoreconf -fi

      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure --with-blas-backend=blis --enable-werror

      - name: make
        run: make -C build -j"$(nproc)"

      # What this job measured on: the backend, and the machine as the
      # probe sees it. On the arm64 runners this is also where to look to
      # find out what /proc/cpuinfo actually offers there.
      - name: Provenance
        run: build/src/c/level1/double/bmb_ddot --version

      - name: make check
        run: make -C build check

      # --verify at the sizes and thread counts a user measures, against this
      # job's library: make check only uses tiny ones.
      - name: Verified at real sizes
        run: .github/scripts/verify-sweep.sh build

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-blis
          path: |
            build/**/test-suite.log
            build/**/*.sh.log
          if-no-files-found: ignore

  # Netlib's reference BLAS, from Ubuntu's libblas-dev: Fortran routines
  # with no C interface, which the benchmarks reach through their own
  # CBLAS layer (src/c/netlib); the yardstick every optimised library is
  # measured against.
  netlib:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libblas-dev pkg-config

      - name: autoreconf
        run: ./autogen.sh

      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure --with-blas-backend=netlib --enable-werror

      - name: make
        run: make -C build -j"$(nproc)"

      # What this job measured on: the backend, and the machine as the
      # probe sees it. On the arm64 runners this is also where to look to
      # find out what /proc/cpuinfo actually offers there.
      - name: Provenance
        run: build/src/c/level1/double/bmb_ddot --version

      # Also covers test_netlib_cblas, which checks the shim's row-major to
      # column-major translation against naive reference implementations.
      - name: make check
        run: make -C build check

      # --verify at the sizes and thread counts a user measures, against this
      # job's library: make check only uses tiny ones.
      - name: Verified at real sizes
        run: .github/scripts/verify-sweep.sh build

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-netlib
          path: |
            build/**/test-suite.log
            build/**/*.log
          if-no-files-found: ignore

  # The report page in the browsers the Chrome-based jobs above do not
  # cover: Firefox, which the README tells users to open it with, and Edge.
  # Firefox has no --dump-dom, so browser.sh drives it through geckodriver;
  # Edge is driven like Chrome. The runner image ships Firefox, geckodriver
  # and, normally, Edge.
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, microsoft-edge]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libopenblas-dev pkg-config

      - name: Firefox and geckodriver
        if: matrix.browser == 'firefox'
        run: |
          if ! command -v geckodriver >/dev/null && [ -x "$GECKOWEBDRIVER/geckodriver" ]; then
            echo "$GECKOWEBDRIVER" >> "$GITHUB_PATH"
          fi
          firefox --version
          PATH="$GECKOWEBDRIVER:$PATH" geckodriver --version | head -1

      # From Microsoft's repository if the image ever stops shipping it.
      - name: Edge
        if: matrix.browser == 'microsoft-edge'
        run: |
          if ! command -v microsoft-edge >/dev/null; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-edge.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" \
              | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
            sudo apt-get update
            sudo apt-get install -y microsoft-edge-stable
          fi
          microsoft-edge --version

      - name: autoreconf
        run: ./autogen.sh

      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure --enable-werror

      - name: make
        run: make -C build -j"$(nproc)"

      - name: Report tests in ${{ matrix.browser }}
        env:
          BMB_BROWSER: ${{ matrix.browser }}
        run: make -C build/src/report check

      # A SKIP would be make check passing with the page unchecked.
      - name: The page was checked in ${{ matrix.browser }}
        run: |
          grep -h 'rendering with' build/src/report/test_bmb_report_render.sh.log \
                                   build/src/report/test_bmb_report_js.sh.log
          if grep -l '^:test-result: SKIP' build/src/report/*.trs; then
            echo "a report test was skipped"; exit 1
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.browser }}
          path: |
            build/src/report/*.log
            build/src/report/*.d/
          if-no-files-found: ignore

  # The man pages, on another distribution than the other jobs: Fedora, with
  # its own groff and man-db builds, and mandoc, whose lint is stricter than
  # groff. BMB_MAN_STRICT turns a missing tool into a failure rather than a
  # SKIP, so this job cannot pass without checking everything. No
  # --enable-werror: Fedora's newer GCC is not what this job is testing.
  man:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc make autoconf automake libtool pkgconf-pkg-config openblas-devel \
            groff man-db mandoc diffutils findutils git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: autoreconf
        run: ./autogen.sh

      # Fedora keeps cblas.h in /usr/include/openblas, which configure only
      # finds through the hint a cluster module would also set.
      - name: configure
        run: |
          mkdir -p build
          cd build
          OPENBLAS_INCDIR=/usr/include/openblas ../configure

      - name: make
        run: make -C build -j"$(nproc)"

      - name: Tools
        run: |
          groff --version | head -1
          man --version
          mandoc -V 2>&1 | head -1 || true

      - name: Man page tests, nothing skipped
        env:
          BMB_MAN_STRICT: 1
        run: make -C build/man check

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-man
          path: build/man/*.log
          if-no-files-found: ignore

  # NVPL and ArmPL both target aarch64 (NVIDIA Grace / Arm servers), so these
  # two jobs run on GitHub's arm64-hosted runners (free for public repos)
  # instead of ubuntu-latest.
  nvpl:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Install NVPL BLAS
        # No stable "latest" alias is published; bump this version (and the
        # ubuntu2404 tag, if the runner image's Ubuntu release changes) when
        # https://developer.nvidia.com/nvpl-downloads moves on.
        run: |
          curl -fsSL -o nvpl-repo.deb "https://developer.download.nvidia.com/compute/nvpl/26.5/local_installers/nvpl-local-repo-ubuntu2404-26.5_1.0-1_arm64.deb"
          sudo dpkg -i nvpl-repo.deb
          sudo cp /var/nvpl-local-repo-ubuntu2404-26.5/nvpl-local-*-keyring.gpg /usr/share/keyrings/
          sudo apt-get update
          sudo apt-get install -y libnvpl-blas0 libnvpl-blas-dev

      - name: autoreconf
        run: autoreconf -fi

      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure --with-blas-backend=nvpl --enable-werror

      - name: make
        run: make -C build -j"$(nproc)"

      # What this job measured on: the backend, and the machine as the
      # probe sees it. On the arm64 runners this is also where to look to
      # find out what /proc/cpuinfo actually offers there.
      - name: Provenance
        run: build/src/c/level1/double/bmb_ddot --version

      - name: make check
        run: make -C build check

      # --verify at the sizes and thread counts a user measures, against this
      # job's library: make check only uses tiny ones.
      - name: Verified at real sizes
        run: .github/scripts/verify-sweep.sh build

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-nvpl
          path: |
            build/**/test-suite.log
            build/**/*.sh.log
          if-no-files-found: ignore

  # Arm Performance Libraries, from Arm's own apt repository (the package
  # that adds it is fetched from developer.arm.com), on the arm64 runner:
  # see the comment above nvpl.
  armpl:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Install Arm Performance Libraries
        run: |
          curl -fsSL -O "https://developer.arm.com/packages/arm-toolchains/ubuntu/pool/arm-toolchains-repository_2-2~noble_all.deb"
          sudo dpkg -i arm-toolchains-repository_2-2~noble_all.deb
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y arm-performance-libraries

      - name: autoreconf
        run: autoreconf -fi

      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure --with-blas-backend=armpl --enable-werror

      - name: make
        run: make -C build -j"$(nproc)"

      # What this job measured on: the backend, and the machine as the
      # probe sees it. On the arm64 runners this is also where to look to
      # find out what /proc/cpuinfo actually offers there.
      - name: Provenance
        run: build/src/c/level1/double/bmb_ddot --version

      - name: make check
        run: make -C build check

      # --verify at the sizes and thread counts a user measures, against this
      # job's library: make check only uses tiny ones.
      - name: Verified at real sizes
        run: .github/scripts/verify-sweep.sh build

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-armpl
          path: |
            build/**/test-suite.log
            build/**/*.sh.log
          if-no-files-found: ignore

  # Built at -O1 with AddressSanitizer and UndefinedBehaviorSanitizer. This
  # is not a duplicate of the openblas job: it catches what a plain build
  # cannot see at all (out-of-bounds accesses, signed overflow), and the
  # lower optimisation level makes GCC's diagnostics land differently --
  # the first -Werror failure this job ever produced was a
  # format-truncation warning invisible at -O2.
  sanitizers:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libopenblas-dev pkg-config

      - name: autoreconf
        run: ./autogen.sh

      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure --enable-werror \
            CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined"

      - name: make
        run: make -C build -j"$(nproc)"

      # What this job measured on: the backend, and the machine as the
      # probe sees it. On the arm64 runners this is also where to look to
      # find out what /proc/cpuinfo actually offers there.
      - name: Provenance
        run: build/src/c/level1/double/bmb_ddot --version

      # Leak detection stays on for our own code; the BLAS library's own
      # per-thread buffers, which it never frees by design, are suppressed
      # by module in .github/scripts/lsan-suppressions.txt.
      - name: make check
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/scripts/lsan-suppressions.txt
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make -C build check

      # --verify at the sizes and thread counts a user measures, against this
      # job's library: make check only uses tiny ones.
      - name: Verified at real sizes
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/scripts/lsan-suppressions.txt
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: .github/scripts/verify-sweep.sh build

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-sanitizers
          path: |
            build/**/test-suite.log
            build/**/*.log
          if-no-files-found: ignore

  # Which lines of the C code make check runs, and which it never reaches:
  # each test was seen to fail, but that says nothing of the paths no test
  # takes. No threshold -- the report is there to be read. The per-file
  # summary is on the run's page; the line-by-line HTML report, an lcov
  # and a Cobertura file are in the coverage-<backend> artifact. The
  # Cobertura one goes to Codecov, for the README's badge, authenticated by the job's OIDC token rather
  # than a stored secret; Codecov being down does not fail the job. Once
  # per backend Ubuntu packages, each uploaded with its own flag: code that
  # only runs under one (a library with no version string, a
  # single-threaded one) counts where it runs, and Codecov merges the
  # reports of a commit.
  coverage:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [openblas, netlib, blis]
    permissions:
      contents: read
      id-token: write   # Codecov's upload, authenticated by OIDC
    env:
      BACKEND: ${{ matrix.backend }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          case $BACKEND in
            openblas) package=libopenblas-dev ;;
            netlib) package=libblas-dev ;;
            blis) package=libblis-openmp-dev ;;
          esac
          sudo apt-get install -y autoconf automake libtool "$package" pkg-config gcovr

      - name: autoreconf
        run: ./autogen.sh

      # -O0 so that every line maps to code gcov can count.
      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure --with-blas-backend="$BACKEND" --enable-werror \
            CFLAGS="-O0 -g --coverage" LDFLAGS="--coverage"

      - name: make
        run: make -C build -j"$(nproc)"

      - name: make check
        run: make -C build check

      # The tests' own code is left out (test_*, and the fuzz targets'
      # fuzz_*): what matters is what they reach.
      - name: Coverage report
        run: |
          cd build
          mkdir -p coverage
          gcovr --root .. src --exclude '.*/(test|fuzz)_[^/]*$' \
            --txt coverage/summary.txt \
            --html-details coverage/index.html \
            --lcov coverage/coverage.lcov \
            --cobertura coverage/coverage.xml \
            --print-summary
          {
            echo "### Coverage of the C code by \`make check\`, $BACKEND"
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.backend }}
          path: build/coverage/

      # Cobertura rather than lcov: gcovr 7.0's lcov keeps the lines a
      # GCOVR_EXCL marker excludes, as never run (#134).
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage/coverage.xml
          flags: ${{ matrix.backend }}
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-coverage-${{ matrix.backend }}
          path: |
            build/**/test-suite.log
            build/**/*.sh.log
          if-no-files-found: ignore

  # cppcheck over the C code: what -Wall -Wextra does not see, on paths no
  # test takes -- its first run found pointer arithmetic on a failed malloc
  # in every verify(). Any finding fails the job; a wrong one is suppressed
  # where it is, with the reason (.github/scripts/cppcheck.sh). CodeQL runs in its
  # own workflow, codeql.yml.
  cppcheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libopenblas-dev pkg-config cppcheck

      - name: autoreconf
        run: ./autogen.sh

      # cppcheck reads config.h, which configure writes.
      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure

      - name: cppcheck
        run: |
          cppcheck --version
          .github/scripts/cppcheck.sh build

  # The command-line parser fuzzed, on inputs no test wrote: ClusterFuzzLite
  # builds src/c/common/fuzz_bmb_options.c with libFuzzer (.clusterfuzzlite/),
  # from its seed corpus and dictionary, then runs it for five minutes,
  # once under AddressSanitizer and once under UndefinedBehaviorSanitizer.
  # A crash, a sanitizer report or a promise of the parser broken fails
  # the job, with the input that did it. On pull requests only; every job
  # that runs make check replays the corpus.
  fuzz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]

    steps:
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      - name: Fuzz
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}

  # FlexiBLAS loads the BLAS library at run time (FLEXIBLAS=...), so one
  # build measures several. Debian and Ubuntu do not package it; Fedora
  # does, as its default BLAS, with OpenBLAS, BLIS and Netlib as backends.
  # Everything runs once per backend from the same build, and the results
  # of two of them must name the library each loaded: two series.
  flexiblas:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          dnf install -y gcc make autoconf automake libtool diffutils findutils \
            flexiblas flexiblas-devel flexiblas-netlib flexiblas-openblas-openmp flexiblas-blis-openmp

      # What this FlexiBLAS can load, and the names FLEXIBLAS= takes.
      - name: Backends
        run: flexiblas list

      - name: autoreconf
        run: ./autogen.sh

      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure --with-blas-backend=flexiblas --enable-werror

      - name: make
        run: make -C build -j"$(nproc)"

      - name: Provenance
        run: |
          for b in OPENBLAS-OPENMP BLIS-OPENMP NETLIB; do
            FLEXIBLAS=$b build/src/c/level1/double/bmb_ddot --version
          done

      - name: make check, once per backend
        run: |
          for b in OPENBLAS-OPENMP BLIS-OPENMP NETLIB; do
            echo "::group::FLEXIBLAS=$b"
            FLEXIBLAS=$b make -C build check || { cat build/src/c/*.log build/src/c/*/test-suite.log; exit 1; }
            echo "::endgroup::"
          done

      # --verify at the sizes and thread counts a user measures, against each
      # library this one build can load.
      - name: Verified at real sizes, once per backend
        run: |
          for b in OPENBLAS-OPENMP BLIS-OPENMP; do
            FLEXIBLAS=$b .github/scripts/verify-sweep.sh build
          done

      # The point of FlexiBLAS here: the same binary, two libraries, two
      # series. Each file must name the library it loaded, and bmb_report
      # must take both; test_report.js checks they make two series.
      - name: One build, two libraries
        run: |
          D=build/src/c/level3/double/bmb_dgemm
          FLEXIBLAS=OPENBLAS-OPENMP $D -x 0 -i 1 -m 64:256 -o openblas.json >/dev/null
          FLEXIBLAS=BLIS-OPENMP $D -x 0 -i 1 -m 64:256 -o blis.json >/dev/null
          grep '"backend"\|"blas"' openblas.json blis.json
          grep -q '"backend": "flexiblas/openblas-openmp",' openblas.json
          grep -q '"backend": "flexiblas/blis-openmp",' blis.json
          build/src/report/bmb_report openblas.json blis.json > report.html
          grep -c 'class="bmb-result"' report.html | grep -qx 2

      # The same through bmb_suite, which sets FLEXIBLAS a library: a
      # directory each, each result naming the library it loaded, and a
      # name FlexiBLAS does not know refused before anything runs.
      - name: bmb_suite, two libraries
        run: |
          S=build/src/suite/bmb_suite
          $S --blas flexiblas:OPENBLAS-OPENMP,BLIS-OPENMP --routine ddot,dgemv,dgemm -o suite \
            -- -x 0 -i 1 -w 0 -v 4096 -m 64
          for r in ddot dgemv dgemm; do
            grep -q '"backend": "flexiblas/openblas-openmp",' suite/OPENBLAS-OPENMP/$r.json
            grep -q '"backend": "flexiblas/blis-openmp",' suite/BLIS-OPENMP/$r.json
          done
          build/src/report/bmb_report suite > suite.html
          grep -c 'class="bmb-result"' suite.html | grep -qx 6
          if $S --blas flexiblas:NO-SUCH -o none 2>err.txt; then exit 1; fi
          grep "FLEXIBLAS=NO-SUCH loads" err.txt
          test ! -e none

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-flexiblas
          path: |
            build/**/test-suite.log
            build/**/*.sh.log
          if-no-files-found: ignore

  # AOCL-BLAS, AMD's fork of BLIS and what AMD EPYC clusters measure
  # against. No distribution packages it, so it is built from AMD's
  # sources, a release pinned by commit, as AMD builds it (the amdzen
  # configuration, OpenMP, CBLAS), and cached; configure finds it through
  # AOCL_ROOT, as a module would set it. The benchmarks must link its
  # threaded libblis-mt, and -t must change the time.
  aocl:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    env:
      AOCL_COMMIT: 25cad99a6840855ade0a49871197f48ee0e1d317 # 5.3.2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: aocl-cache
        with:
          path: ~/aocl
          key: aocl-${{ env.AOCL_COMMIT }}-${{ runner.os }}

      - name: Build AOCL-BLAS
        if: steps.aocl-cache.outputs.cache-hit != 'true'
        run: |
          git init -q "$RUNNER_TEMP/aocl-src"
          cd "$RUNNER_TEMP/aocl-src"
          git fetch -q --depth 1 https://github.com/amd/blis.git "$AOCL_COMMIT"
          git checkout -q FETCH_HEAD
          ./configure --enable-cblas --enable-threading=openmp --prefix="$HOME/aocl" amdzen
          make -j"$(nproc)"
          make install

      - name: autoreconf
        run: autoreconf -fi

      - name: configure
        run: |
          mkdir -p build
          cd build
          AOCL_ROOT="$HOME/aocl" ../configure --with-blas-backend=aocl --enable-werror

      - name: make
        run: make -C build -j"$(nproc)"

      - name: Provenance
        run: |
          build/src/c/level1/double/bmb_ddot --version | tee version.txt
          grep -q '^BLAS backend: aocl (AOCL-BLAS ' version.txt
          ldd build/src/c/level3/double/bmb_dgemm > ldd.txt
          grep -q 'libblis-mt\.so' ldd.txt

      - name: make check
        run: make -C build check

      # --verify at the sizes and thread counts a user measures, against this
      # job's library: make check only uses tiny ones.
      - name: Verified at real sizes
        run: .github/scripts/verify-sweep.sh build

      # libblis (single-threaded) would ignore -t and still pass everything
      # above: on 4 threads dgemm must take clearly less time than on 1.
      - name: Threads are used
        run: |
          d=build/src/c/level3/double/bmb_dgemm
          $d -x 1 -i 3 -m 1024 -t 1 -C -o t1.csv >/dev/null
          $d -x 1 -i 3 -m 1024 -t 4 -C -o t4.csv >/dev/null
          t1=$(sed -n 's/^1,1024,1024,\([0-9.]*\),.*/\1/p' t1.csv)
          t4=$(sed -n 's/^4,1024,1024,\([0-9.]*\),.*/\1/p' t4.csv)
          echo "1 thread: $t1 s, 4 threads: $t4 s"
          awk -v a="$t1" -v b="$t4" 'BEGIN { exit !(a > 0 && b > 0 && b < 0.75 * a) }'

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-aocl
          path: |
            build/**/test-suite.log
            build/**/*.sh.log
          if-no-files-found: ignore

  # Intel oneAPI MKL, the BLAS most x86 clusters measure against, from
  # Intel's apt repository: its current release, as sites install it. The
  # benchmarks link its GNU OpenMP threading layer and set its BLAS
  # thread count (mkl_domain_set_num_threads); the runner's CPU, Intel or
  # AMD, is whatever GitHub gives.
  mkl:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Install oneAPI MKL
        run: .github/scripts/install-oneapi-mkl.sh

      - name: autoreconf
        run: autoreconf -fi

      - name: configure
        run: |
          mkdir -p build
          cd build
          ../configure --with-blas-backend=mkl --enable-werror

      - name: make
        run: make -C build -j"$(nproc)"

      - name: Provenance
        run: build/src/c/level1/double/bmb_ddot --version

      - name: make check
        run: make -C build check

      # --verify at the sizes and thread counts a user measures, against this
      # job's library: make check only uses tiny ones.
      - name: Verified at real sizes
        run: .github/scripts/verify-sweep.sh build

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-mkl
          path: |
            build/**/test-suite.log
            build/**/*.sh.log
          if-no-files-found: ignore

  # The Docker image (packaging/docker), per backend, as a user builds it;
  # its last stage already runs one tiny benchmark per level. From the
  # image: every benchmark verified, the man pages, a result written to a
  # mounted directory as the host's user and turned into a report, and the
  # warning that a CPU quota or affinity smaller than -t gets. Once, the
  # Dockerfile's lint, and the image converted and run by Apptainer.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [openblas, blis, netlib, mkl]
    env:
      BACKEND: ${{ matrix.backend }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: hadolint
        if: matrix.backend == 'openblas'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: packaging/docker/Dockerfile

      - name: Build the image
        run: docker build -f packaging/docker/Dockerfile --build-arg BLAS_BACKEND="$BACKEND" -t bmb .

      - name: Provenance
        run: |
          docker run --rm bmb bmb_ddot --version | tee version.txt
          grep -q "^BLAS backend: $BACKEND\( \|$\)" version.txt
          test "$(docker run --rm bmb id -un)" = bmb

      - name: Every benchmark, verified in the image
        run: |
          docker run --rm bmb sh -ec '
            n=0
            for b in /usr/local/libexec/blas-microbenchmark/level*/bmb_*; do
              case $b in
                */level1/*) "$b" -x 0 -i 1 -t 1,2 -v 1000 >/dev/null ;;
                *) "$b" -x 0 -i 1 -t 1,2 -m 48 --layout col >/dev/null
                   "$b" -x 0 -i 1 -t 1,2 -m 48 >/dev/null ;;
              esac
              n=$((n + 1))
            done
            test "$n" -ge 32
            echo "all $n benchmarks verified"'

      - name: Man pages
        run: |
          docker run --rm -e MANPAGER=cat bmb man blas-microbenchmark > man.txt
          grep -q 'bmb_dgemm' man.txt
          docker run --rm -e MANPAGER=cat bmb man bmb_report > man.txt
          grep -q 'bmb_report' man.txt
          docker run --rm -e MANPAGER=cat bmb man bmb_suite > man.txt
          grep -q 'bmb_suite' man.txt

      - name: Results to a mounted directory, then the report
        run: |
          mkdir out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/results" bmb \
            bmb_dgemm -x 0 -i 1 -m 32:64 -o dgemm.json >/dev/null
          test "$(stat -c %u out/dgemm.json)" = "$(id -u)"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/results" bmb \
            bmb_report dgemm.json > report.html
          grep -qi '^<!doctype html>' report.html

      # The suite the image ships (#279), as a user runs it: into a mounted
      # directory, a result and a log a routine, the report on the whole.
      - name: bmb_suite to a mounted directory, then its report
        run: |
          mkdir runs
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/runs:/results" bmb \
            bmb_suite --routine ddot,dgemm -o suite -- -x 0 -i 1 -w 0 -v 64 -m 16
          for r in ddot dgemm; do
            test -s "runs/suite/$r.json" && test -s "runs/suite/$r.log"
          done
          test "$(stat -c %u runs/suite/dgemm.json)" = "$(id -u)"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/runs:/results" bmb \
            bmb_report suite > suite.html
          test "$(grep -c 'class="bmb-result"' suite.html)" -eq 2

      # Netlib takes no thread count, so there is nothing to warn about.
      - name: A CPU quota or affinity smaller than -t is warned about
        if: matrix.backend != 'netlib'
        run: |
          docker run --rm --cpus 1 bmb bmb_dgemm -x 0 -i 1 -m 32 -t 2 2>err >/dev/null
          cat err
          grep -q 'may only run on 1 CPU (' err
          docker run --rm --cpuset-cpus 0,1 bmb bmb_dgemm -x 0 -i 1 -m 32 -t 4 2>err >/dev/null
          cat err
          grep -q 'up to 4 threads, but this process may only run on 2 CPUs' err
          docker run --rm --cpus 2 bmb bmb_dgemm -x 0 -i 1 -m 32 -t 2 2>err >/dev/null
          if grep -q 'may only run on' err; then cat err; exit 1; fi

      # As the README has it: saved where Docker is, converted to a SIF file
      # where Apptainer is. Apptainer's own package, pinned by its checksum
      # as the actions are by commit.
      - name: Apptainer
        if: matrix.backend == 'openblas'
        run: |
          deb=apptainer_1.5.4_amd64.deb
          curl -fsSLO "https://github.com/apptainer/apptainer/releases/download/v1.5.4/$deb"
          echo "281cf9bd68f16b6f7c34a3a94d77668bc327b9c09db0412ce7890162734a97f7  $deb" | sha256sum -c
          sudo apt-get update
          sudo apt-get install -y "./$deb"
          docker save -o bmb.tar bmb
          apptainer build bmb.sif docker-archive://bmb.tar
          apptainer exec bmb.sif bmb_dgemm -x 0 -i 1 -m 32 -o sif.json >/dev/null
          apptainer exec bmb.sif bmb_report sif.json > sif.html
          grep -qi '^<!doctype html>' sif.html

  # The ReFrame tests (packaging/reframe), as a site runs them, on ReFrame's
  # generic system (this runner, no scheduler) at small sizes: bmb_run on
  # an install, every routine, with references it meets; one it cannot
  # meet, and a run that was not verified (-C), each failing it;
  # bmb_build_run on this commit's tarball; their results read by
  # bmb_report; and the copy make install puts beside the benchmarks,
  # running that install with no option. ReFrame's list of routines must
  # be the benchmarks the build installs. ReFrame is pinned to a release.
  reframe:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libopenblas-dev pkg-config

      - name: Install ReFrame
        run: |
          python3 -m venv "$RUNNER_TEMP/rfm"
          "$RUNNER_TEMP/rfm/bin/pip" install ReFrame-HPC==4.10.4
          echo "$RUNNER_TEMP/rfm/bin" >> "$GITHUB_PATH"

      - name: Build, install, and make the tarball
        run: |
          autoreconf -fi
          mkdir -p build
          cd build
          ../configure --prefix="$PWD/../inst"
          make -j"$(nproc)"
          make install
          make dist

      - name: The routines are the benchmarks installed
        run: |
          reframe -c packaging/reframe/blas_microbenchmark.py -n bmb_run -l > list.txt
          sed -n 's/^- bmb_run %routine=\([a-z0-9]*\) .*/\1/p' list.txt | sort > reframe.txt
          ls inst/libexec/blas-microbenchmark/level*/ | sed -n 's/^bmb_//p' | sort > installed.txt
          diff reframe.txt installed.txt
          test "$(wc -l < reframe.txt)" -ge 32

      - name: bmb_run, every routine, with references it meets
        run: |
          echo '{"generic": {"dgemm": {"gflops": [0.001, -0.5, null]}, "dcopy": {"gbytes_per_s": [0.001, -0.5, null]}}}' > lenient.json
          reframe -c packaging/reframe/blas_microbenchmark.py -n bmb_run \
            -S install_prefix="$PWD/inst" -S level1_size=100000 -S level2_size=256 \
            -S level3_size=128 -S num_threads=2 -S reference_file=lenient.json \
            -r --report-file=run.json
          python3 - <<'EOF'
          import json
          cases = json.load(open('run.json'))['runs'][0]['testcases']
          assert len(cases) >= 32 and all(c['result'] == 'pass' for c in cases), cases
          perf = {c['routine']: c['perfvalues'] for c in cases}
          assert perf['dgemm']['generic:default:gflops'][1] == 0.001, perf['dgemm']
          assert set(perf['dcopy']) == {'generic:default:gbytes_per_s'}, perf['dcopy']
          assert set(perf['ddot']) == {'generic:default:gflops', 'generic:default:gbytes_per_s'}
          assert set(perf['dgemm']) == {'generic:default:gflops'}, perf['dgemm']
          print(len(cases), 'routines passed, their rates and references as expected')
          EOF

      # make install puts the tests beside the benchmarks; run from there,
      # bmb_run takes that install with no install_prefix, as the README
      # and the man page say. No benchmark is on PATH here, so a lookup
      # there would fail.
      - name: The installed tests run their own install
        run: |
          reframe -c inst/share/blas-microbenchmark/reframe/blas_microbenchmark.py \
            -n 'bmb_run%routine=(dgemm|ddot)' -S level1_size=100000 -S level3_size=128 \
            -S num_threads=2 -r --report-file=installed-run.json
          python3 - <<'EOF'
          import json, os
          cases = json.load(open('installed-run.json'))['runs'][0]['testcases']
          assert len(cases) == 2 and all(c['result'] == 'pass' for c in cases), cases
          inst = os.path.realpath('inst/libexec/blas-microbenchmark')
          assert all(os.path.realpath(c['executable']).startswith(inst + '/') for c in cases), \
              [c['executable'] for c in cases]
          print('the installed tests ran the benchmarks of', inst)
          EOF

      - name: A reference it cannot meet, and an unverified run, fail it
        run: |
          echo '{"generic": {"dgemm": {"gflops": [1e9, -0.1, null]}}}' > strict.json
          if reframe -c packaging/reframe/blas_microbenchmark.py -n 'bmb_run%routine=dgemm' \
               -S install_prefix="$PWD/inst" -S level3_size=128 -S num_threads=2 \
               -S reference_file=strict.json -r --report-file=strict-run.json; then
            echo "a reference of 1e9 GFLOP/s was met"; exit 1
          fi
          if reframe -c packaging/reframe/blas_microbenchmark.py -n 'bmb_run%routine=dgemm' \
               -S install_prefix="$PWD/inst" -S level3_size=128 -S num_threads=2 \
               -S bmb_options=-C -r --report-file=unverified-run.json; then
            echo "a run with -C passed"; exit 1
          fi
          python3 - <<'EOF'
          import json
          for f, phase in (('strict-run.json', 'performance'), ('unverified-run.json', 'sanity')):
              case = json.load(open(f))['runs'][0]['testcases'][0]
              assert case['fail_phase'] == phase, (f, case['fail_phase'], case['fail_reason'])
          print('failed in performance and in sanity, as expected')
          EOF

      - name: bmb_build_run on this commit's tarball
        run: |
          reframe -c packaging/reframe/blas_microbenchmark.py -n 'bmb_build_run%routine=(dgemm|ddot|zherk|izamax|dznrm2)' \
            -S bmb_tarball.tarball="$(ls build/blas-microbenchmark-*.tar.gz)" \
            -S level1_size=100000 -S level3_size=128 -S num_threads=2 \
            -r --report-file=build-run.json
          python3 - <<'EOF'
          import json
          cases = json.load(open('build-run.json'))['runs'][0]['testcases']
          runs = [c for c in cases if c['name'].startswith('bmb_build_run')]
          assert len(runs) == 5 and all(c['result'] == 'pass' for c in runs), cases
          print('built from the tarball, 5 routines passed')
          EOF

      - name: Their results make a report
        run: |
          find output -name result.json > results.txt
          test "$(wc -l < results.txt)" -ge 32
          # shellcheck disable=SC2046
          inst/bin/bmb_report $(cat results.txt) > report.html
          grep -qi '^<!doctype html>' report.html

  # The Spack package (packaging/spack), as an HPC user installs it: built
  # by Spack against each BLAS it can build on x86_64, from this commit's
  # tarball and from the latest release's, then checked by its own tests
  # (spack test run). The distribution's BLIS (for BLIS and for
  # AOCL-BLAS, its fork) or Netlib is installed as well, so that linking
  # it instead of Spack's would fail test_linked_library (#58). MKL is Intel's apt package, declared to
  # Spack as an external: Spack's own would download Intel's installer,
  # gigabytes, on every cache miss. Spack and its package recipes are pinned
  # to commits, as the actions are; what Spack builds is cached, keyed on
  # both and on the recipe.
  spack:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blas: [openblas, blis, amdblis, netlib-lapack, flexiblas, intel-oneapi-mkl]
    env:
      SPACK_COMMIT: 3e19345b6e12f5ff1b874f4059622fc6a1fd804a # v1.2.2
      SPACK_PACKAGES_COMMIT: d4f7c711a6a42f1c4d551c8fd10fce9a11340a81 # v2026.06.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libopenblas-dev
          case "${{ matrix.blas }}" in
            blis|amdblis) sudo apt-get install -y libblis-openmp-dev ;;
            netlib-lapack) sudo apt-get install -y libblas-dev ;;
            intel-oneapi-mkl) .github/scripts/install-oneapi-mkl.sh ;;
          esac

      - name: This commit's tarball
        run: |
          ./autogen.sh
          mkdir -p build
          (cd build && ../configure && make dist)
          mkdir -p "$RUNNER_TEMP/src"
          tar xf build/blas-microbenchmark-*.tar.gz -C "$RUNNER_TEMP/src"

      - name: Spack
        run: |
          git init -q "$HOME/spack"
          git -C "$HOME/spack" fetch -q --depth 1 https://github.com/spack/spack.git "$SPACK_COMMIT"
          git -C "$HOME/spack" checkout -q FETCH_HEAD
          . "$HOME/spack/share/spack/setup-env.sh"
          spack repo update builtin --commit "$SPACK_PACKAGES_COMMIT"
          spack repo add "$PWD/packaging/spack/spack_repo/blas_microbenchmark"
          # One target whatever CPU the runner has, so the cache matches.
          spack config add 'packages:all:require:target=x86_64_v3'
          spack compiler find
          spack external find cmake perl python gmake
          if [ "${{ matrix.blas }}" = intel-oneapi-mkl ]; then
            # /opt/intel/oneapi/mkl/<major.minor> is the layout Spack expects
            # of a oneAPI prefix since 2024. threads=openmp requires a
            # compiler, so the external names the runner's default gcc.
            v=$(ls /opt/intel/oneapi/mkl | grep '^[0-9]' | sort -V | tail -1)
            # In the cache's key: installs built against another MKL
            # external would still be tested, and find it gone (#139).
            echo "MKL_VERSION=-$v" >> "$GITHUB_ENV"
            g=$(gcc -dumpfullversion)
            printf '%s\n' 'packages:' '  intel-oneapi-mkl:' '    buildable: false' '    externals:' \
              "    - spec: intel-oneapi-mkl@$v +gfortran threads=openmp %gcc@$g" \
              '      prefix: /opt/intel/oneapi' >"$RUNNER_TEMP/mkl.yaml"
            spack config add -f "$RUNNER_TEMP/mkl.yaml"
          fi
          spack repo list

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/spack/opt/spack
          key: spack-${{ env.SPACK_COMMIT }}-${{ env.SPACK_PACKAGES_COMMIT }}-${{ matrix.blas }}${{ env.MKL_VERSION }}-${{ hashFiles('packaging/spack/**') }}
          restore-keys: spack-${{ env.SPACK_COMMIT }}-${{ env.SPACK_PACKAGES_COMMIT }}-${{ matrix.blas }}${{ env.MKL_VERSION }}-

      - name: spack install and spack test
        run: |
          . "$HOME/spack/share/spack/setup-env.sh"
          .github/scripts/spack-check.sh "${{ matrix.blas }}" "$RUNNER_TEMP"/src/blas-microbenchmark-*
