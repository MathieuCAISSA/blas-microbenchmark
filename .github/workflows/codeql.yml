name: CodeQL

# GitHub's static analysis of the C code, with its security and quality
# queries: data flow across functions, which cppcheck (in ci.yml) does not
# follow. Findings go to the repository's Security tab (code scanning),
# where each one is fixed or dismissed with a reason. Weekly as well, since
# the queries are updated without any change here.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # uploading the results

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libopenblas-dev pkg-config

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      # CodeQL watches the compiler: the build is what it analyses.
      - name: Build
        run: |
          ./autogen.sh
          mkdir -p build
          cd build
          ../configure
          make -j"$(nproc)"
          make -j"$(nproc)" check TESTS=

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:c-cpp
