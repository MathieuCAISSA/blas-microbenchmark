name: Scorecard

# OpenSSF Scorecard: the project's security practices, checked against
# OpenSSF's criteria (pinned actions, token permissions, branch protection,
# code review, ...), published to the Scorecard API for the README's
# badge and its viewer. Its SARIF is kept as an artifact, not uploaded to
# code scanning: the CodeQL workflow fails on any open alert there, and
# Scorecard's findings are a score to read, not defects to dismiss one by
# one. The job is what publish_results allows: the scorecard action, the
# checkout before it and the upload after, nothing else.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write   # publishing the results, signed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 30
