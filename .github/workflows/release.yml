name: Release

# Builds the distribution tarball and attaches it to the GitHub release for
# a pushed tag. GitHub's own auto-generated "Source code" archives are plain
# git exports with no pre-generated `configure`, so end users need this one.
# The tarball carries a signed attestation of where it was built: gh
# attestation verify checks it came from this workflow, in this repository,
# and so does cosign with the attestation's bundle, attached to the release
# beside the tarball.
# A pull request that changes this file runs it too, publishing nothing, so
# that a broken release is found before the tag rather than at it.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload the tarball for"
        required: true
      publish:
        description: "Upload to the release; off, build, attest and verify only (to test this workflow)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the release and its assets
      id-token: write          # the signing certificate for the attestation
      attestations: write      # storing the attestation
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libopenblas-dev pkg-config

      - name: Build the distribution tarball
        run: |
          ./autogen.sh
          mkdir -p build && cd build
          ../configure
          make dist

      - name: Verify the tarball builds with no Autotools
        # A release tarball that still needs autoreconf would defeat its
        # purpose, so unpack it somewhere clean and build it as a user
        # would -- configure, make, make check, make install -- without
        # ever running autogen.sh/autoreconf.
        run: |
          mkdir -p verify && cd verify
          tar xf ../build/blas-microbenchmark-*.tar.gz
          cd blas-microbenchmark-*/
          test -f configure || { echo "tarball has no pre-generated configure"; exit 1; }
          ./configure --prefix="$PWD/_install"
          make -j"$(nproc)"
          make check
          make install
          # Benchmarks install grouped by BLAS level, not into bin.
          ./_install/libexec/blas-microbenchmark/level1/bmb_daxpy -x 1 -i 2 -v 32
          ./_install/libexec/blas-microbenchmark/level3/bmb_dgemm -x 1 -i 2 -m 32
          # bmb_report goes to <prefix>/bin -- the one thing on $PATH -- and
          # must follow --prefix rather than land in /usr/local regardless.
          test -x ./_install/bin/bmb_report
          ./_install/libexec/blas-microbenchmark/level3/bmb_dgemm -x 0 -i 1 -m 32 -o r.json
          ./_install/bin/bmb_report r.json > r.html
          grep -qi '^<!doctype html>' r.html

      # So that a download can be checked: sha256sum -c SHA256SUMS.
      - name: Checksums
        run: |
          cd build
          sha256sum blas-microbenchmark-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      # Signed through Sigstore and stored with this repository: anyone can
      # check a download with gh attestation verify, as README.md says.
      # Pull requests from Dependabot (which updates this file every time) or
      # from a fork get no OIDC token to sign with, so they test the rest.
      - name: Attest where the tarball was built
        id: attest
        if: github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/blas-microbenchmark-*.tar.gz

      # What a user will run: an attestation that does not verify must not
      # ship. gh prints nothing outside a terminal, so read its JSON: the
      # attested digest has to be the tarball's. And a changed tarball has
      # to be refused, or the check proves nothing.
      - name: Verify the attestation
        if: github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls build/blas-microbenchmark-*.tar.gz)
          signer="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" --format json > attestation.json
          digest=$(sha256sum "$f" | cut -d' ' -f1)
          jq -e --arg d "$digest" \
            'any(.[].verificationResult.statement.subject[]; .digest.sha256 == $d)' attestation.json
          jq -r '.[0].verificationResult.signature.certificate.buildSignerURI' attestation.json
          echo "verified: $(basename "$f"), sha256 $digest"
          cp "$f" changed.tar.gz && printf x >> changed.tar.gz
          if gh attestation verify changed.tar.gz --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" >/dev/null 2>&1; then
            echo "a changed tarball verified"; exit 1
          fi
          echo "a changed tarball is refused"

      # The attestation as a file beside the tarball: whoever checks a
      # download without the GitHub CLI does it with cosign and this file,
      # as README.md says, and it is the signature OpenSSF Scorecard looks
      # for on a release (Signed-Releases). Checked here with cosign, for
      # this run's identity (the README's pattern matches every release
      # tag), and a changed tarball refused.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)

      - name: The attestation bundle, checked with cosign
        if: github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          f=$(ls build/blas-microbenchmark-*.tar.gz)
          cp "$BUNDLE" "$f.sigstore.json"
          verify() {
            cosign verify-blob-attestation --bundle "$f.sigstore.json" --type slsaprovenance1 \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              "$1"
          }
          verify "$f"
          echo "verified with cosign: $(basename "$f") against $(basename "$f").sigstore.json"
          cp "$f" changed.tar.gz && printf x >> changed.tar.gz
          if verify changed.tar.gz >/dev/null 2>&1; then
            echo "a changed tarball verified against the bundle"; exit 1
          fi
          echo "a changed tarball is refused"

      - name: Upload the tarball to the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Pushing a tag is enough on its own: create the release if it
          # doesn't exist yet, otherwise just replace the assets.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/blas-microbenchmark-*.tar.gz build/SHA256SUMS \
              build/blas-microbenchmark-*.tar.gz.sigstore.json \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/blas-microbenchmark-*.tar.gz build/SHA256SUMS \
              build/blas-microbenchmark-*.tar.gz.sigstore.json \
              --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  # The Docker image (packaging/docker) on ghcr.io, for the backends whose
  # libraries can be redistributed: OpenBLAS, BLIS, Netlib. Not MKL, whose
  # image would redistribute Intel's libraries (#108). On a version tag,
  # each image is pushed, attested like the tarball (the attestation
  # stored in the registry beside it), then pulled back by its digest, run,
  # and its attestation checked, as the README says. A pull request builds
  # and runs them, pushing nothing.
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [openblas, blis, netlib]
    permissions:
      contents: read
      packages: write          # pushing to ghcr.io
      id-token: write          # the signing certificate for the attestation
      attestations: write      # storing the attestation
      artifact-metadata: write
    env:
      BACKEND: ${{ matrix.backend }}
      IMAGE: ghcr.io/mathieucaissa/blas-microbenchmark

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build the image, and run it
        run: |
          docker build -f packaging/docker/Dockerfile --build-arg BLAS_BACKEND="$BACKEND" -t bmb .
          docker run --rm bmb bmb_ddot --version
          docker run --rm bmb bmb_dgemm -x 0 -i 1 -m 64 >/dev/null

      # X.Y.Z-<backend> for each; X.Y.Z and latest are the OpenBLAS one.
      - name: Push to ghcr.io
        id: push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          v=${TAG#v}
          tags="$v-$BACKEND"
          [ "$BACKEND" != openblas ] || tags="$tags $v latest"
          for t in $tags; do
            docker tag bmb "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$v-$BACKEND" | cut -d@ -f2)
          case $digest in sha256:*) ;; *) echo "no digest for $IMAGE:$v-$BACKEND"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed $IMAGE:{$(echo "$tags" | tr ' ' ',')} @ $digest"

      - name: Attest where the image was built
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # As a user gets it: pulled by digest from ghcr.io, run, verified.
      - name: Pull it back, run it, verify its attestation
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Every local copy gone, so that this is a real pull.
          docker image prune -af >/dev/null
          docker pull "$IMAGE@$DIGEST"
          docker run --rm "$IMAGE@$DIGEST" bmb_dgemm -x 0 -i 1 -m 64 >/dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --format json > image-attestation.json
          jq -e --arg d "${DIGEST#sha256:}" \
            'any(.[].verificationResult.statement.subject[]; .digest.sha256 == $d)' image-attestation.json
          echo "verified: $IMAGE@$DIGEST"
